[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evidence"
version = "0.1.0"
description = "Trace based checks for unsupported claims of coding agent completion"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
dependencies = []

[project.scripts]
agent-evidence = "agent_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
